name: Overseas Costing CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify paired inventory owner commit
        env:
          REQUIRED_INVENTORY_BRANDING_SHA: 0ecae087da52155fe5745e1d55dde0e599d04cb6
        run: |
          git fetch --no-tags --depth 1 https://github.com/yueweiit/deeplinkerp-deeplinkerp_branding.git "$REQUIRED_INVENTORY_BRANDING_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$REQUIRED_INVENTORY_BRANDING_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements.txt

      - name: Verify generated workbench assets
        run: |
          python overseas_costing/scripts/build_workbench_assets.py
          git diff --exit-code -- overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.js overseas_costing/overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.js overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.css overseas_costing/overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.css

      - name: Check workbench JavaScript syntax
        run: |
          node --check overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.js
          node --check overseas_costing/overseas_costing/page/overseas_cost_workbench/overseas_cost_workbench.js

      - name: Verify air sea comparison assets
        run: |
          python overseas_costing/scripts/build_air_sea_assets.py
          git diff --exit-code -- overseas_costing/page/air_sea_cost_comparison overseas_costing/overseas_costing/page/air_sea_cost_comparison
          node --check overseas_costing/page/air_sea_cost_comparison/air_sea_cost_comparison.js
          node --check overseas_costing/overseas_costing/page/air_sea_cost_comparison/air_sea_cost_comparison.js

      - name: Run tests affected by this update
        env:
          TEST_BASE: ${{ github.event.before }}
        run: python overseas_costing/scripts/run_affected_tests.py "$TEST_BASE"

      - name: Compile Python files
        run: python -m compileall -q overseas_costing

  deploy:
    name: Deploy to DeepLinkERP
    # The mirror runs CI only; both repositories otherwise rebuild the same host.
    if: github.repository == 'yueweiit/DeepLinkERP'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: overseas-costing-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -n "$DEPLOY_HOST" || (echo "Missing DEPLOY_HOST" && exit 1)
          test -n "$DEPLOY_USER" || (echo "Missing DEPLOY_USER" && exit 1)
          test -n "$DEPLOY_SSH_PRIVATE_KEY" || (echo "Missing DEPLOY_SSH_PRIVATE_KEY" && exit 1)
          test -n "$DEPLOY_KNOWN_HOSTS" || (echo "Missing DEPLOY_KNOWN_HOSTS" && exit 1)
          test -n "$DEEPSEEK_API_KEY" || (echo "Missing DEEPSEEK_API_KEY" && exit 1)

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Configure known hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Preflight DeepSeek connection
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python .github/scripts/preflight_deepseek.py

      - name: Reclaim unused Docker build cache
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_reclaim_script="/tmp/reclaim_docker_space-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_resolve_script="/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/reclaim_docker_space.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_reclaim_script"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/resolve_base_image.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_resolve_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "BASE_IMAGE_SCRIPT='$remote_resolve_script' bash '$remote_reclaim_script' /home/yuewei/ERPNext-Docker/frappe_docker; script_exit_code=\$?; rm -f '$remote_reclaim_script'; exit \$script_exit_code"

      - name: Preflight document parsing runtime
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_runtime_script="/tmp/preflight_document_runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_runtime_dockerfile="/tmp/preflight_material_ai_runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.Containerfile"
          remote_resolve_script="/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/install_document_runtime.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_runtime_script"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/material-ai-runtime.Containerfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_runtime_dockerfile"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/resolve_base_image.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_resolve_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "BASE_IMAGE_SCRIPT='$remote_resolve_script' bash '$remote_runtime_script' /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '$remote_runtime_dockerfile' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' preflight; script_exit_code=\$?; rm -f '$remote_runtime_script' '$remote_runtime_dockerfile'; exit \$script_exit_code"

      - name: Ensure ERP services are running
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" '
              set -eu
              cd /home/yuewei/ERPNext-Docker/frappe_docker
              docker compose -f compose.custom.yaml up -d \
                backend websocket queue-short queue-long scheduler frontend
              for attempt in $(seq 1 10); do
                backend_id=$(docker compose -f compose.custom.yaml ps -q backend)
                if [ -n "$backend_id" ]; then
                  exit 0
                fi
                sleep 3
              done
              docker compose -f compose.custom.yaml ps -a
              docker compose -f compose.custom.yaml logs --tail=200 backend
              exit 1
            '

      - name: Prepare production rollback point
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_release_script="/tmp/manage_material_ai_release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_asset_script="/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_resolve_script="/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/manage_material_ai_release.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_release_script"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/sync_and_verify_assets.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_asset_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "BASE_IMAGE_SCRIPT='$remote_resolve_script' bash '$remote_release_script' prepare /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Inspect and normalize route revision before upgrade
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_route_revision_script="/tmp/prepare-route-revision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/prepare_route_revision_migration.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_route_revision_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$remote_route_revision_script' /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com; script_exit_code=\$?; rm -f '$remote_route_revision_script'; exit \$script_exit_code"

      - name: Upgrade and migrate ERP
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REQUIRED_INVENTORY_BRANDING_SHA: 0ecae087da52155fe5745e1d55dde0e599d04cb6
          REQUIRED_INVENTORY_BRANDING_CONTENT_SHA256: c31a5c76b9c006cbbc1ca2c3ea87b1238f59a329667dbc38d70fc919d352b688
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && python3 - <<'"'"'PY'"'"'
          import json

          with open("apps.json", encoding="utf-8") as handle:
              entries = json.load(handle)
          for index, entry in enumerate(entries):
              app_name = str(entry.get("app_name") or entry.get("name") or "")
              branch = str(entry.get("branch") or "")
              print({"index": index, "app_name": app_name, "branch": branch})
          PY'
          remote_upgrade_script="/tmp/upgrade_and_migrate_erp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/upgrade_and_migrate_erp.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_upgrade_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "GITHUB_RUN_ID='${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' REQUIRED_INVENTORY_BRANDING_SHA='0ecae087da52155fe5745e1d55dde0e599d04cb6' REQUIRED_INVENTORY_BRANDING_CONTENT_SHA256='c31a5c76b9c006cbbc1ca2c3ea87b1238f59a329667dbc38d70fc919d352b688' bash '$remote_upgrade_script' /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '${REQUIRED_INVENTORY_BRANDING_CONTENT_SHA256}'; script_exit_code=\$?; rm -f '$remote_upgrade_script'; exit \$script_exit_code"

      - name: Verify company rename integrity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com execute overseas_costing.services.company_rename_service.verify_company_renames_complete'

      - name: Install document parsing runtime
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_runtime_script="/tmp/install_document_runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          remote_runtime_dockerfile="/tmp/material-ai-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.Containerfile"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/install_document_runtime.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_runtime_script"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/material-ai-runtime.Containerfile \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_runtime_dockerfile"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ASSET_SYNC_SCRIPT='/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' BASE_IMAGE_SCRIPT='/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' bash '$remote_runtime_script' /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '$remote_runtime_dockerfile' '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}' install; script_exit_code=\$?; rm -f '$remote_runtime_script' '$remote_runtime_dockerfile'; exit \$script_exit_code"

      - name: Prewarm packing sheet local cache
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com execute overseas_costing.services.packing_sheet_cache_service.prewarm_catalog_cache'

      - name: Configure and verify material AI
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          local_key_file="$RUNNER_TEMP/deepseek-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.key"
          remote_key_file="/tmp/deepseek-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.key"
          remote_config_script="/tmp/configure_material_ai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          umask 077
          printf '%s' "$DEEPSEEK_API_KEY" > "$local_key_file"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$local_key_file" "$DEPLOY_USER@$DEPLOY_HOST:$remote_key_file"
          rm -f "$local_key_file"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            .github/scripts/configure_material_ai.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$remote_config_script"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ASSET_SYNC_SCRIPT='/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' bash '$remote_config_script' /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '$remote_key_file'; script_exit_code=\$?; rm -f '$remote_config_script' '$remote_key_file'; exit \$script_exit_code"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com execute overseas_costing.services.material_ai_fill_service.verify_material_ai_runtime --kwargs '"'"'{"check_connection": True}'"'"''

      - name: Synchronize and verify frontend assets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_asset_script="/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/yuewei/ERPNext-Docker/frappe_docker && bash '$remote_asset_script'"

      - name: Publish workbench release marker
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com set-config overseas_costing_release_id '${GITHUB_SHA}' && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com clear-cache"

      - name: Check online maintenance response
        run: |
          # A maintenance 503 is success, not a curl retry condition.  Explicit
          # attempts also avoid retrying a response body into /dev/null, which
          # some curl versions cannot rewind (CURLE_WRITE_ERROR / exit 23).
          task_http_deadline=$((SECONDS + 90))
          for task_http_attempt in $(seq 1 19); do
            if task_http_status=$(curl --silent --show-error \
              --connect-timeout 5 --max-time 5 \
              --output /dev/null --write-out '%{http_code}' \
              https://deeplinkerp.com/login); then
              if [ "$task_http_status" = "200" ] || [ "$task_http_status" = "503" ]; then
                echo "Online maintenance response: HTTP $task_http_status"
                exit 0
              fi
            else
              task_http_status="000"
            fi
            echo "Waiting for online maintenance response: HTTP $task_http_status"
            if [ "$SECONDS" -ge "$task_http_deadline" ] || [ "$task_http_attempt" -eq 19 ]; then
              break
            fi
            sleep 5
          done
          echo "Online maintenance response check failed" >&2
          exit 1

      # Run the reviewed business-data correction only after all runtime,
      # assets and HTTP checks, while the original backup still covers it.
      - name: Transfer legacy Mexico inventory to YUEWEI MX
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com execute overseas_costing.services.company_inventory_transfer_service.execute_company_inventory_transfer'

      - name: Verify company inventory transfer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /home/yuewei/ERPNext-Docker/frappe_docker && docker compose -f compose.custom.yaml exec -T -w /home/frappe/frappe-bench backend bench --site deeplinkerp.com execute overseas_costing.services.company_inventory_transfer_service.verify_company_inventory_transfer_complete'

      - name: Finalize production release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_release_script="/tmp/manage_material_ai_release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "ASSET_SYNC_SCRIPT='/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' BASE_IMAGE_SCRIPT='/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' bash '$remote_release_script' finish /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'"

      - name: Rollback failed ERP release
        if: failure() || cancelled()
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          remote_release_script="/tmp/manage_material_ai_release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "if [ -f '$remote_release_script' ]; then ASSET_SYNC_SCRIPT='/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' BASE_IMAGE_SCRIPT='/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' bash '$remote_release_script' rollback-safe /home/yuewei/ERPNext-Docker/frappe_docker deeplinkerp.com '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; fi"

      - name: Remove temporary deployment files
        if: always()
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "rm -f '/tmp/manage_material_ai_release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/sync_and_verify_assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/resolve_base_image-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/reclaim_docker_space-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/prepare-route-revision-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/upgrade_and_migrate_erp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh' '/tmp/deepseek-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.key' '/tmp/configure_material_ai-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.sh'"
